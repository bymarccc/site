<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96.png?v=3"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/favicon-192.png?v=3"><link rel="shortcut icon" href="/favicon.ico?v=3"><link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=3">

<title>My account — bymarccc</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     bymarccc account — CIRCLE (Bronze · Silver · Gold · Platinum), orders & returns, credits, details,
     addresses, wishlist, my playlist, preferences, refer a friend. Same black / white / #F5F4F1 language.
     ===================================================================== */
  :root{ --ink:#111; --sub:#6b6b68; --line:#e4e4e1; --bg:#F5F4F1; --err:#d21f3c; --ok:#1f7a3e; --bronze:#b5522f; --silver:#7d8288; --gold:#a8822b; --platinum:#4a4f57; }
  *{ box-sizing:border-box; }
  html,body{ background:#fff; }
  body{ margin:0; min-height:100vh; font-family:"Jost","Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  a{ color:inherit; } input,button,select{ font-family:inherit; }
  .top{ display:flex; align-items:center; justify-content:space-between; padding:16px clamp(16px,4vw,48px); background:#fff; border-bottom:1px solid var(--line); }
  .top__logo{ display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:600; font-size:13px; letter-spacing:.28em; }
  .top__logo img{ width:30px; height:30px; object-fit:contain; display:block; }
  .top__back{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; color:var(--sub); }
  #membersMain{ flex:1; width:100%; max-width:1180px; margin:0 auto; padding:clamp(22px,4vw,48px) clamp(16px,4vw,40px) 72px; }
  .ac-load{ padding:60px 0; text-align:center; color:var(--sub); font-size:14px; }
  /* signed out */
  .ac-in{ max-width:460px; margin:0 auto; }
  .ac-in h1{ font-size:clamp(26px,4vw,34px); font-weight:500; margin:0 0 8px; }
  .ac-in p.lead{ color:var(--sub); margin:0 0 22px; font-size:15px; line-height:1.55; }
  .ac-gift{ background:#111; color:#fff; border-radius:14px; padding:14px 16px; margin:0 0 18px; font-size:14px; line-height:1.45; }
  .f{ display:grid; gap:6px; margin-bottom:14px; }
  .f label{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--sub); }
  .f input,.f select{ height:48px; padding:0 14px; border:1px solid #c9c9c5; border-radius:6px; background:#fff; font-size:16px; color:var(--ink); width:100%; }
  .f input:focus,.f select:focus{ outline:2px solid #111; outline-offset:1px; }
  .f.code input{ letter-spacing:.5em; text-align:center; font-size:22px; font-weight:600; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 22px; border:0; border-radius:6px; background:#111; color:#fff; font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; text-decoration:none; }
  .btn.full{ width:100%; } .btn:disabled{ opacity:.5; cursor:default; }
  .btn--ghost{ background:none; color:var(--ink); border:1px solid #c9c9c5; }
  .btn--sm{ min-height:36px; padding:0 14px; font-size:10.5px; }
  .msg{ min-height:20px; margin:0 0 12px; font-size:13px; color:var(--err); } .msg.ok{ color:var(--ok); }
  .ac-tiers{ margin-top:30px; border-top:1px solid var(--line); padding-top:20px; display:grid; gap:12px; }
  .ac-tiers div{ display:flex; justify-content:space-between; gap:12px; font-size:14px; }
  .ac-tiers b{ font-weight:600; }
  @media (max-width:560px){ .ac-tiers div{ flex-direction:column; gap:2px; } .ac-tiers div span:last-child{ color:var(--sub); font-size:13px; } }
  /* signed in: Farfetch-style two columns */
  .ac{ display:grid; grid-template-columns:280px 1fr; gap:56px; }
  .ac-nav h3{ margin:0 0 14px; font-size:13px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; }
  .ac-nav ul{ list-style:none; margin:0 0 22px; padding:0 0 22px; border-bottom:1px solid var(--line); }
  .ac-nav ul:last-child{ border-bottom:0; }
  .ac-nav a{ display:block; padding:9px 0 9px 18px; text-decoration:none; font-size:15px; color:#222; }
  .ac-nav a[aria-current="page"]{ font-weight:600; }
  .ac-nav .tierdot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:1px; }
  .ac-main h2{ font-size:clamp(24px,3vw,30px); font-weight:400; margin:0 0 28px; }
  .ac-main h4{ font-size:20px; font-weight:400; margin:34px 0 12px; }
  .ac-main p{ line-height:1.6; }
  .ac-back{ display:none; margin:0 0 18px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; color:var(--sub); }
  @media (max-width:860px){
    .ac{ grid-template-columns:1fr; gap:0; }
    .ac.is-section .ac-nav{ display:none; } .ac:not(.is-section) .ac-main{ display:none; }
    .ac-back{ display:inline-block; }
  }
  /* CIRCLE */
  .tier-head{ text-align:center; margin:10px 0 34px; }
  .tier-head .brand{ font-size:clamp(30px,5vw,44px); letter-spacing:.18em; font-weight:300; }
  .tier-head .brand span{ font-size:.5em; letter-spacing:.04em; font-weight:500; margin-left:10px; vertical-align:middle; }
  .tier-head p{ margin:8px 0 0; font-size:16px; }
  .bar{ position:relative; height:28px; border-radius:999px; background:#f2f2f0; margin:0 auto; max-width:620px; }
  .bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; min-width:28px; transition:width .6s; }
  .bar-legend{ display:flex; justify-content:space-between; max-width:620px; margin:16px auto 0; text-align:center; font-size:14px; }
  .bar-legend b{ display:block; font-size:18px; font-weight:400; margin-bottom:2px; }
  .perks{ max-width:620px; margin:30px auto 0; border:1px solid var(--line); padding:20px 22px; }
  .perks h5{ margin:0 0 10px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:500; }
  .perks ul{ margin:0; padding-left:18px; line-height:1.8; }
  details.what{ max-width:620px; margin:22px auto 0; border-top:1px solid var(--line); padding-top:14px; }
  details.what summary{ cursor:pointer; text-align:center; font-size:14px; list-style:none; } details.what summary::-webkit-details-marker{ display:none; }
  .tiers-table{ width:100%; border-collapse:collapse; margin-top:16px; font-size:14px; }
  .tiers-table th,.tiers-table td{ border-bottom:1px solid var(--line); padding:10px 6px; text-align:left; vertical-align:top; }
  .tiers-table th{ font-weight:500; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--sub); }
  /* orders */
  .ord{ border:1px solid var(--line); padding:18px; margin-bottom:14px; }
  .ord-top{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px; }
  .ord-top b{ font-weight:600; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; background:#f2f2f0; font-size:12px; text-transform:capitalize; }
  .ord-items{ display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  .ord-items img{ width:64px; height:80px; object-fit:cover; background:#f5f4f1; }
  .ord-line{ font-size:13px; color:var(--sub); }
  .empty{ font-size:20px; margin:8px 0 6px; } .empty + p{ color:var(--sub); margin:0; }
  .kv{ font-size:16px; line-height:2; } .big{ font-size:34px; font-weight:400; margin:0 0 6px; }
  .card2{ border:1px solid var(--line); padding:20px; margin-bottom:14px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; } @media (max-width:560px){ .grid2{ grid-template-columns:1fr; } }
  .copy{ display:flex; gap:10px; } .copy input{ flex:1; height:48px; border:0; background:#f5f4f1; padding:0 14px; font-size:15px; }
  .toggle{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .toggle input{ width:22px; height:22px; accent-color:#111; }
  /* wishlist */
  .wl-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:22px 14px; }
  .wl-grid a{ text-decoration:none; } .wl-grid img{ width:100%; aspect-ratio:2/3; object-fit:cover; background:#f5f4f1; display:block; }
  .wl-grid .t{ font-size:12px; letter-spacing:.06em; text-transform:uppercase; margin-top:8px; } .wl-grid .p{ font-size:13px; color:var(--sub); }
  .wl-grid button{ border:0; background:none; padding:4px 0; font-size:12px; text-decoration:underline; cursor:pointer; color:var(--sub); }
  /* playlist */
  .pl-tabs{ display:inline-flex; gap:8px; margin:0 0 20px; }
  .pl-tabs button{ border:1px solid #111; background:#fff; border-radius:999px; padding:10px 18px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; }
  .pl-tabs button[aria-pressed="true"]{ background:#111; color:#fff; }
  .trk{ display:grid; grid-template-columns:52px 1fr auto auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .trk img{ width:52px; height:52px; object-fit:cover; border-radius:8px; background:#eee; }
  .trk .n{ font-size:15px; } .trk .d{ font-size:12px; color:var(--sub); }
  .trk button{ width:38px; height:38px; border-radius:50%; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:15px; display:grid; place-items:center; }
  .trk button{ color:#111; }
  .trk button.play{ width:42px; height:42px; border:0; color:#fff; background:radial-gradient(circle at 50% 30%, #2b2b2b 0%, #111 55%, #050505 100%); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55), 0 3px 10px rgba(0,0,0,.28); transition: transform .15s; }
  .trk button.play:active{ transform: scale(.92); }
  .trk button.play svg{ width:19px; height:19px; display:block; }
  .trk button.play .ic-pause{ display:none; } .trk button.play.is-playing .ic-play{ display:none; } .trk button.play.is-playing .ic-pause{ display:block; }
  .trk button.play .ic-play{ margin-left:2px; }
  .trk.is-on .n{ font-weight:600; }
  .al-logo{ height:1em; width:auto; vertical-align:-.12em; margin-right:.28em; }   /* original alien logo, cap height (same as an O) */
  .ytm-lock{ max-width:560px; border:1px solid var(--line); border-radius:14px; padding:18px 20px; background:var(--bg); }
  .ytm-lock b{ display:block; margin-bottom:6px; }
</style>

<main id="membersMain">
  <div class="ac-load" id="acLoad">Loading your account…</div>
  <div id="acRoot" hidden></div>
</main>

<script>
(() => {
  'use strict';
  const root = document.getElementById('acRoot'), load = document.getElementById('acLoad');
  if (!root) return;
  const API = (action, body) => fetch('/api/account' + (body ? '' : '?action=' + action), body ? { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action }, body)) } : { credentials: 'same-origin' })
    .then(r => r.json().then(d => { if (!r.ok) throw Object.assign(new Error(d.error || 'Something went wrong.'), { status: r.status }); return d; }));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const G = window.BYM_GEO && window.BYM_GEO.rule ? window.BYM_GEO : null;
  const money = ron => G ? G.fmt(ron) : (Math.round(ron * 100) / 100).toLocaleString('ro-RO') + ' RON';
  const ronMoney = ron => Math.round(ron).toLocaleString('ro-RO') + ' RON';
  const dateF = s => { try { return new Date(s).toLocaleDateString(document.documentElement.lang || 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return s; } };
  const TIER_COL = { bronze: 'var(--bronze)', silver: 'var(--silver)', gold: 'var(--gold)', platinum: 'var(--platinum)' };
  const CAT = () => (window.BYMARCCC_CATALOG && window.BYMARCCC_CATALOG.CATALOG) || {};
  const qs = new URLSearchParams(location.search);
  let P = null;   // profile

  /* ---------------- signed out: e-mail → code ---------------- */
  function signedOut() {
    const ref = qs.get('ref') || (document.cookie.match(/(?:^|; )bym_ref=([A-Z0-9]+)/) || [])[1] || '';
    root.innerHTML = `<div class="ac-in">
      <h1>Sign in or create an account</h1>
      <p class="lead">One account for your orders, returns, wishlist, your own playlist and FAM rewards. No password — we e-mail you a code.</p>
      ${ref ? '<div class="ac-gift">A friend invited you: <b>10% off your first order</b> is waiting in your new account.</div>' : ''}
      <form id="acStart" novalidate>
        <div class="f"><label for="acEmail">E-mail</label><input id="acEmail" type="email" autocomplete="email" inputmode="email" required></div>
        <p class="msg" id="acMsg" role="alert"></p>
        <button class="btn full" type="submit">Continue</button>
      </form>
      <form id="acVerify" hidden novalidate>
        <p class="lead" id="acSent"></p>
        <div class="f code"><label for="acCode">6-digit code</label><input id="acCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>
        <p class="msg" id="acMsg2" role="alert"></p>
        <button class="btn full" type="submit">Sign in</button>
        <p style="text-align:center;margin-top:14px"><button type="button" class="btn btn--ghost btn--sm" id="acAgain">Use another e-mail</button></p>
      </form>
      <div class="ac-tiers"><div><b><img class="al-logo" src="/assets/img/alien-logo.png" alt="">FAM</b><span></span></div>
        <div><span><span class="tierdot" style="background:var(--bronze)"></span>Bronze</span><span>Welcome · your own playlist</span></div>
        <div><span><span class="tierdot" style="background:var(--silver)"></span>Silver · 1 500 RON</span><span>10% off &amp; free shipping &amp; returns</span></div>
        <div><span><span class="tierdot" style="background:var(--gold)"></span>Gold · 4 000 RON</span><span>20% off &amp; free shipping &amp; returns &amp; early drops</span></div>
        <div><span><span class="tierdot" style="background:var(--platinum)"></span>Platinum · 10 000 RON</span><span>30% off &amp; free shipping &amp; returns &amp; early drops</span></div>
      </div></div>`;
    root.querySelectorAll('.tierdot').forEach(d => { d.style.display = 'inline-block'; d.style.width = d.style.height = '9px'; d.style.borderRadius = '50%'; d.style.marginRight = '8px'; });
    let email = '';
    const $ = id => document.getElementById(id);
    $('acStart').addEventListener('submit', async e => {
      e.preventDefault(); email = $('acEmail').value.trim(); $('acMsg').textContent = '';
      const b = e.submitter || $('acStart').querySelector('button'); b.disabled = true;
      try { await API('start', { email, ref }); $('acStart').hidden = true; $('acVerify').hidden = false; $('acSent').textContent = `We sent a 6-digit code to ${email}. It expires in 15 minutes.`; $('acCode').focus(); }
      catch (err) { $('acMsg').textContent = err.message; } finally { b.disabled = false; }
    });
    $('acVerify').addEventListener('submit', async e => {
      e.preventDefault(); $('acMsg2').textContent = '';
      const b = $('acVerify').querySelector('button[type=submit]'); b.disabled = true;
      try { const d = await API('verify', { email, code: $('acCode').value, ref }); P = d.profile; await mergeWishlist(); signedIn(); }
      catch (err) { $('acMsg2').textContent = err.message; } finally { b.disabled = false; }
    });
    $('acCode').addEventListener('input', () => { if ($('acCode').value.replace(/\D/g, '').length === 6) $('acVerify').requestSubmit(); });
    $('acAgain').addEventListener('click', () => { $('acVerify').hidden = true; $('acStart').hidden = false; });
  }

  /* ---------------- signed in ---------------- */
  const SECTIONS = [['circle', 'FAM'], ['playlist', '<img class="al-logo" src="/assets/img/alien-logo.png" alt="">Playlist'], ['orders', 'Orders and returns'], ['ytm', 'My Playlist'], ['details', 'Details and security'], ['addresses', 'Address book'], ['wishlist', 'Wishlist'], ['refer', 'Refer a friend']];
  function signedIn() {

    el.innerHTML = `<h2>Communication preferences</h2><form id="prF" style="max-width:560px">
      <label class="toggle"><span>New collections and offers by e-mail</span><input type="checkbox" name="news"${p.news ? ' checked' : ''}></label>

      <p class="msg" id="prMsg"></p></form><p style="color:var(--sub);font-size:14px">Order and delivery e-mails are always sent.</p>`;
    el.querySelector('#prF').addEventListener('change', async () => { const f = el.querySelector('#prF'), m = el.querySelector('#prMsg');
      try { const d = await API('prefs', { news: f.news.checked, drops: f.drops.checked, sms: f.sms.checked }); P.prefs = d.prefs; m.className = 'msg ok'; m.textContent = 'Saved.'; } catch (e) { m.className = 'msg'; m.textContent = e.message; } });
  }
  async function secRefer(el) {
    const d = await API('referrals'), c = await API('credits');
    const v = c.vouchers.filter(x => x.pct);
    el.innerHTML = `<h2>Refer a friend</h2><p style="font-size:24px;margin:0 0 26px">${v.length ? `You have ${v.length} referral reward${v.length > 1 ? 's' : ''} (−${v[0].pct}% on your next order)` : 'No referral rewards available'}</p>
      <div class="card2"><div style="font-size:22px">🎁</div><p style="margin:8px 0 2px"><b>Give 10% &amp; Get 10%</b></p><p style="margin:0 0 16px">Treat your friends to 10% off their first order and get 10% off your next order in return.</p>
        <p style="margin:0 0 8px"><b>Your referral link</b></p><div class="copy"><input id="rfLink" value="${esc(P.refLink)}" readonly><button class="btn" id="rfShare">Invite friends</button></div><p class="msg ok" id="rfMsg"></p></div>
      <h4>How it works</h4><ol style="line-height:1.8;padding-left:20px"><li>Share your unique link with friends.</li><li>They create a bymarccc account from your link and get 10% off their first order.</li><li>You get 10% off your next order once their order is placed.</li></ol>
      <p style="color:var(--sub);font-size:13px">Your reward is valid for 60 days. The best single discount applies at checkout (FAM tier or referral); discounts don't stack.</p>
      <h4>Your referral rewards history</h4>${d.referrals.length ? d.referrals.map(r => `<div class="ord-line" style="padding:8px 0;border-bottom:1px solid var(--line)">${dateF(r.created_at)} · ${esc(r.referee)} · ${r.status === 'ordered' ? 'ordered — reward issued' : 'signed up'}</div>`).join('') : '<p>You don\'t have any successful referrals yet — start inviting friends to earn your first reward.</p>'}`;
    el.querySelector('#rfShare').addEventListener('click', async () => {
      const link = P.refLink, txt = 'Get 10% off your first bymarccc order with my link:';
      if (navigator.share) { try { await navigator.share({ title: 'bymarccc', text: txt, url: link }); return; } catch {} }
      try { await navigator.clipboard.writeText(link); el.querySelector('#rfMsg').textContent = 'Link copied — paste it to your friends.'; } catch { el.querySelector('#rfLink').select(); }
    });
  }

  API('me').then(d => { load.hidden = true; root.hidden = false; P = d.profile; if (P) { mergeWishlist(); signedIn(); } else signedOut(); })
    .catch(() => { load.textContent = 'Accounts are not available right now. Please try again in a moment.'; });
})();
